<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>عذرخواهی با شکلات</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'Vazirmatn', sans-serif;
    background: linear-gradient(160deg, #1a0a2e 0%, #16213e 45%, #0f3460 100%);
    color: #fff;
    min-height: 100vh;
  }

  .petal {
    position: fixed;
    pointer-events: none;
    z-index: 2;
    border-radius: 50% 0;
    opacity: 0.65;
    animation: fall linear infinite;
  }

  @keyframes fall {
    0%   { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.65; }
    90%  { opacity: 0.5; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 10;
    max-width: 480px;
    margin: 0 auto;
    padding: 22px 16px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header {
    text-align: center;
    margin-bottom: 16px;
    animation: fadeInDown 0.9s ease-out both;
  }

  .header h1 {
    font-size: 1.7rem;
    font-weight: 700;
    background: linear-gradient(90deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.3;
  }

  .header p {
    font-size: 0.95rem;
    color: rgba(255,255,255,0.7);
    margin-top: 6px;
    font-weight: 300;
  }

  #canvas-wrap {
    width: 100%;
    height: 380px;
    border-radius: 22px;
    overflow: hidden;
    margin-bottom: 20px;
    background: radial-gradient(ellipse at 50% 40%, rgba(255,182,193,0.16) 0%, transparent 70%);
    box-shadow: 0 20px 40px -10px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.08);
    animation: fadeIn 1.1s ease-out 0.2s both;
  }

  #canvas-wrap canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  .card {
    width: 100%;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    padding: 26px 18px;
    box-shadow: 0 20px 40px -12px rgba(0,0,0,0.35);
    animation: fadeInUp 1s ease-out 0.4s both;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1, #ff9a9e);
    background-size: 200% 100%;
    animation: shimmer 4s linear infinite;
  }

  .text {
    font-size: 1.05rem;
    line-height: 1.95;
    text-align: center;
    color: rgba(255,255,255,0.93);
  }

  .text .pink {
    color: #ffb6c1;
    font-weight: 600;
  }

  .text .heart {
    color: #ff6b8a;
    display: inline-block;
    animation: beat 1.3s ease-in-out infinite;
  }

  .sign {
    margin-top: 20px;
    text-align: left;
    font-size: 1rem;
    color: #f8c8dc;
    font-weight: 500;
  }

  .sign span {
    display: block;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.5);
    margin-top: 4px;
    font-weight: 300;
  }

  .btn-box {
    margin-top: 24px;
    width: 100%;
    animation: fadeIn 1.1s ease-out 0.7s both;
  }

  .love-btn {
    width: 100%;
    background: linear-gradient(135deg, #ff6b8a, #ff8e9e, #fbc2eb);
    border: none;
    color: white;
    padding: 16px;
    font-size: 1.1rem;
    font-family: 'Vazirmatn', sans-serif;
    font-weight: 600;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(255,107,138,0.4);
    transition: transform 0.25s ease;
  }

  .love-btn:active {
    transform: scale(0.97);
  }

  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes beat {
    0%,100% { transform: scale(1); }
    20%     { transform: scale(1.25); }
    40%     { transform: scale(1); }
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .float-heart {
    position: fixed;
    pointer-events: none;
    z-index: 100;
    font-size: 22px;
    animation: rise 2.4s ease-out forwards;
  }

  @keyframes rise {
    0%   { transform: translateY(0) scale(1); opacity: 0.9; }
    100% { transform: translateY(-85vh) scale(1.3); opacity: 0; }
  }

  @media (max-width: 360px) {
    .header h1 { font-size: 1.5rem; }
    .text { font-size: 0.98rem; }
    #canvas-wrap { height: 340px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>با طعم شکلات...</h1>
    <p>عذرخواهی از ته دل</p>
  </div>

  <div id="canvas-wrap"></div>

  <div class="card">
    <div class="text">
      می‌دونم هنوز با هم قهریم و دلم خیلی برات تنگ شده.<br><br>
      <span class="pink">منتظر نیستم با این کار همه چیز یک‌شبه درست بشه.</span><br>
      فقط می‌خوام بدونی که <span class="pink">همیشه دوستت دارم</span> 
      و این احساس هیچ‌وقت از بین نرفته.<br><br>
      این دسته گل شکلاتی رو با عشق برات درست کردم 
      <span class="heart">♥</span>
    </div>
    <div class="sign">
      با عشق همیشگی
      <span>همیشه و تا ابد مال توام</span>
    </div>
  </div>

  <div class="btn-box">
    <button class="love-btn" id="loveBtn">دوستت دارم</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // ذرات گلبرگ
  (function() {
    const colors = ['#ff6b8a','#ff8e9e','#fbc2eb','#ffb6c1','#e8a0bf','#ff9a9e'];
    for (let i = 0; i < 24; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      const s = 8 + Math.random() * 12;
      p.style.width = s + 'px';
      p.style.height = s + 'px';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationDuration = (9 + Math.random() * 12) + 's';
      p.style.animationDelay = (Math.random() * 13) + 's';
      document.body.appendChild(p);
    }
  })();

  // Three.js
  const wrap = document.getElementById('canvas-wrap');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, wrap.clientWidth / wrap.clientHeight, 0.1, 100);
  camera.position.set(0, 2.1, 8.2);
  camera.lookAt(0, 1.1, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  wrap.appendChild(renderer.domElement);

  // نور
  scene.add(new THREE.AmbientLight(0xffe4e9, 0.8));
  const dLight = new THREE.DirectionalLight(0xffffff, 1.1);
  dLight.position.set(5, 10, 7);
  scene.add(dLight);
  const p1 = new THREE.PointLight(0xff9a9e, 1.2, 20);
  p1.position.set(-3.5, 4, 4);
  scene.add(p1);
  const p2 = new THREE.PointLight(0xa18cd1, 0.55, 14);
  p2.position.set(4, 2, -2);
  scene.add(p2);

  const bouquet = new THREE.Group();
  scene.add(bouquet);

  // رنگ گل‌ها
  const colors = [0xff6b8a, 0xff8e9e, 0xfbc2eb, 0xffb6c1, 0xe8a0bf, 0xff9a9e, 0xd4a5c9, 0xff7eb3, 0xf8a5c2, 0xc9a0dc];

  // ساخت رز
  function createRose(color, scale) {
    const g = new THREE.Group();
    // مرکز
    g.add(new THREE.Mesh(
      new THREE.SphereGeometry(0.13 * scale, 14, 14),
      new THREE.MeshStandardMaterial({ color, roughness: 0.38 })
    ));
    // گلبرگ‌ها
    for (let i = 0; i < 16; i++) {
      const angle = (i / 16) * Math.PI * 2;
      const layer = Math.floor(i / 5);
      const petal = new THREE.Mesh(
        new THREE.SphereGeometry(0.19 * scale, 11, 11),
        new THREE.MeshStandardMaterial({ color, roughness: 0.34, side: THREE.DoubleSide })
      );
      petal.scale.set(1, 0.52, 0.88);
      const r = (0.24 + layer * 0.13) * scale;
      petal.position.set(Math.cos(angle) * r, layer * 0.045 * scale, Math.sin(angle) * r);
      petal.rotation.y = angle;
      petal.rotation.x = -0.45 - layer * 0.16;
      g.add(petal);
    }
    // گلبرگ بیرونی
    for (let i = 0; i < 9; i++) {
      const angle = (i / 9) * Math.PI * 2 + 0.18;
      const petal = new THREE.Mesh(
        new THREE.SphereGeometry(0.23 * scale, 11, 11),
        new THREE.MeshStandardMaterial({ 
          color: new THREE.Color(color).offsetHSL(0, -0.04, 0.07), 
          roughness: 0.38, 
          side: THREE.DoubleSide 
        })
      );
      petal.scale.set(1.1, 0.38, 0.82);
      petal.position.set(Math.cos(angle) * 0.42 * scale, -0.02 * scale, Math.sin(angle) * 0.42 * scale);
      petal.rotation.y = angle;
      petal.rotation.x = -0.72;
      g.add(petal);
    }
    return g;
  }

  // ساقه + برگ
  function createStem(h) {
    const g = new THREE.Group();
    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.038, 0.048, h, 8),
      new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.68 })
    );
    stem.position.y = -h / 2;
    g.add(stem);
    for (let i = 0; i < 3; i++) {
      const leaf = new THREE.Mesh(
        new THREE.SphereGeometry(0.19, 9, 9),
        new THREE.MeshStandardMaterial({ color: 0x3a7d34, roughness: 0.58, side: THREE.DoubleSide })
      );
      leaf.scale.set(1.55, 0.24, 0.68);
      leaf.position.set((i % 2 === 0 ? 0.24 : -0.24), -0.45 - i * 0.5, (Math.random() - 0.5) * 0.12);
      leaf.rotation.z = (i % 2 === 0 ? -0.65 : 0.65);
      g.add(leaf);
    }
    return g;
  }

  // موقعیت گل‌ها - دسته گل بزرگ و پر
  const positions = [
    { x: 0.00, y: 2.05, z: 0.00, s: 1.25, c: 0xff6b8a },
    { x: 0.65, y: 1.80, z: 0.30, s: 1.05, c: 0xfbc2eb },
    { x: -0.60, y: 1.85, z: 0.25, s: 1.00, c: 0xff8e9e },
    { x: 0.40, y: 1.95, z: -0.40, s: 0.95, c: 0xffb6c1 },
    { x: -0.45, y: 1.90, z: -0.35, s: 0.98, c: 0xe8a0bf },
    { x: 0.90, y: 1.50, z: -0.10, s: 0.90, c: 0xff9a9e },
    { x: -0.85, y: 1.55, z: 0.05, s: 0.92, c: 0xd4a5c9 },
    { x: 0.25, y: 1.60, z: 0.65, s: 0.88, c: 0xff7eb3 },
    { x: -0.30, y: 1.65, z: -0.65, s: 0.90, c: 0xf8a5c2 },
    { x: 0.75, y: 1.35, z: 0.50, s: 0.82, c: 0xc9a0dc },
    { x: -0.70, y: 1.40, z: 0.50, s: 0.85, c: 0xff6b8a },
    { x: 0.10, y: 1.35, z: -0.75, s: 0.80, c: 0xff8e9e },
    { x: 1.05, y: 1.25, z: 0.20, s: 0.78, c: 0xfbc2eb },
    { x: -1.00, y: 1.30, z: -0.15, s: 0.80, c: 0xffb6c1 },
    { x: 0.55, y: 1.20, z: -0.55, s: 0.75, c: 0xe8a0bf },
    { x: -0.50, y: 1.25, z: 0.70, s: 0.77, c: 0xff9a9e }
  ];

  positions.forEach((p, i) => {
    const rose = createRose(p.c, p.s);
    rose.position.set(p.x, p.y, p.z);
    rose.rotation.y = Math.random() * Math.PI * 2;
    rose.rotation.x = (Math.random() - 0.5) * 0.28;
    rose.rotation.z = (Math.random() - 0.5) * 0.22;
    bouquet.add(rose);

    const stem = createStem(2.0 + Math.random() * 0.4);
    stem.position.set(p.x * 0.28, p.y - 1.05, p.z * 0.28);
    stem.rotation.z = p.x * 0.12;
    stem.rotation.x = p.z * 0.09;
    bouquet.add(stem);
  });

  // روبان دور دسته گل
  const ribbon = new THREE.Mesh(
    new THREE.TorusGeometry(0.72, 0.07, 12, 40),
    new THREE.MeshStandardMaterial({ color: 0xff6b8a, roughness: 0.28, metalness: 0.22 })
  );
  ribbon.position.y = 0.25;
  ribbon.rotation.x = Math.PI / 2;
  bouquet.add(ribbon);

  // روبان آویزان
  const dropMat = new THREE.MeshStandardMaterial({ color: 0xff6b8a, roughness: 0.28, metalness: 0.22 });
  const drop1 = new THREE.Mesh(new THREE.BoxGeometry(0.09, 1.05, 0.025), dropMat);
  drop1.position.set(0.32, -0.35, 0.55);
  drop1.rotation.z = 0.28;
  bouquet.add(drop1);
  const drop2 = new THREE.Mesh(new THREE.BoxGeometry(0.09, 1.0, 0.025), dropMat);
  drop2.position.set(-0.28, -0.4, 0.5);
  drop2.rotation.z = -0.22;
  bouquet.add(drop2);

  // گل‌های کوچک سفید (برای پرتر شدن)
  function smallFlower() {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(
      new THREE.SphereGeometry(0.055, 9, 9),
      new THREE.MeshStandardMaterial({ color: 0xffe066 })
    ));
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * Math.PI * 2;
      const petal = new THREE.Mesh(
        new THREE.SphereGeometry(0.065, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0xfff0f5, side: THREE.DoubleSide })
      );
      petal.scale.set(1.25, 0.38, 0.7);
      petal.position.set(Math.cos(a) * 0.11, 0, Math.sin(a) * 0.11);
      petal.rotation.y = a;
      g.add(petal);
    }
    return g;
  }

  for (let i = 0; i < 11; i++) {
    const f = smallFlower();
    const a = (i / 11) * Math.PI * 2;
    const r = 0.95 + Math.random() * 0.35;
    f.position.set(Math.cos(a) * r * 0.65, 1.1 + Math.random() * 0.55, Math.sin(a) * r * 0.65);
    f.scale.setScalar(0.75 + Math.random() * 0.4);
    bouquet.add(f);
  }

  // انیمیشن
  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.008;
    bouquet.rotation.y = Math.sin(t * 0.42) * 0.16;
    bouquet.position.y = Math.sin(t * 0.65) * 0.07;
    renderer.render(scene, camera);
  }
  animate();

  // ریسپانسیو
  window.addEventListener('resize', () => {
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  // دکمه
  document.getElementById('loveBtn').addEventListener('click', () => {
    for (let i = 0; i < 16; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'float-heart';
        h.textContent = '♥';
        h.style.left = (28 + Math.random() * 44) + '%';
        h.style.bottom = '14%';
        h.style.color = ['#ff6b8a','#ff8e9e','#fbc2eb','#ffb6c1'][Math.floor(Math.random()*4)];
        h.style.fontSize = (18 + Math.random() * 14) + 'px';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 2500);
      }, i * 70);
    }
  });
</script>
</body>
</html>
